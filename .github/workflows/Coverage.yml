name: Coverage

on: 
    push:
        branches: main
        paths-ignore:
            - 'README.md'
        tags: ['*']
    pull_request:
        branches: main
        paths-ignore:
            - 'README.md'
    workflow_dispatch:
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
    coverage:
        name: Code Coverage
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            JULIA_NUM_THREADS: '4'
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Julia
              uses: julia-actions/setup-julia@v3
              with:
                version: '1.10'

            - name: Cache dependencies
              uses: julia-actions/cache@v3
              with:
                cache-name: cov-ubuntu-latest-1.10

            - name: Build backends from source
              run: julia --project=. scripts/build_from_source.jl

            - name: Point tests at the freshly built backends
              shell: bash
              run: |
                echo "SPHEROIDALWAVES_LIBRARY_DOUBLE=$(pwd)/build/lib/libspheroidal_batch_double.so" >> "$GITHUB_ENV"
                echo "SPHEROIDALWAVES_LIBRARY_QUAD=$(pwd)/build/lib/libspheroidal_batch_quad.so" >> "$GITHUB_ENV"

            - name: Coverage test
              uses: julia-actions/julia-runtest@v1
              with:
                coverage: true
                optimize: 1

            - name: Process coverage test results
              uses: julia-actions/julia-processcoverage@v1

            - name: Upload coverage results
              uses: codecov/codecov-action@v7
              with:
                files: lcov.info
                token: ${{ secrets.CODECOV_TOKEN }}
                disable_search: true
                fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}

            - name: Upload raw coverage artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: cov-raw-files
                path: |
                    src/**/*.cov
                    ext/**/*.cov
                retention-days: 7
