name: CI
env:
  JULIA_NUM_THREADS: 2
  JULIA_NUM_PRECOMPILE_TASKS: 1
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  JULIA_CPU_TARGET: generic

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
    tags: ['*']
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
    inputs:
      clean:
        description: Bypass native and Julia compilation caches
        type: boolean
        default: false
      source_run:
        description: Run focused timings using this CI run's artifacts (blank runs full CI)
        type: string
        default: ''
      timing_julia:
        description: Julia version for focused timings
        type: choice
        options: ['1', 'pre', '1.10']
        default: '1'
      timing_runtime:
        description: Measure reuse of the prepared Intel macOS Julia runtime
        type: boolean
        default: false
      timing_cases:
        description: JSON cases with name, groups, threads, optimize, and optional os/arch values
        type: string
        default: '[{"name":"functions-2","groups":"angular-and-coefficients,functions-and-coefficients","threads":2,"optimize":1},{"name":"functions-4","groups":"angular-and-coefficients,functions-and-coefficients","threads":4,"optimize":1}]'
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ inputs.source_run != '' && github.run_id || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  timing:
    if: inputs.source_run != ''
    uses: ./.github/workflows/Timings.yml
    permissions:
      contents: read
      actions: read
    with:
      source_run: ${{ inputs.source_run }}
      julia: ${{ inputs.timing_julia }}
      cases: ${{ inputs.timing_cases }}
      prepare_runtime: ${{ inputs.timing_runtime || false }}

  native-backends:
    if: inputs.source_run == ''
    name: Build native backends - ${{ matrix.platform.os }} - ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-26-intel
            arch: x64
          - os: macos-latest
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
          arch: ${{ matrix.platform.arch }}
      - uses: fortran-lang/setup-fortran@v1
        if: runner.os != 'Linux'
        with:
          compiler: gcc
          version: '15'
      - name: Use the runner's Fortran compiler
        if: runner.os == 'Linux'
        shell: bash
        run: echo "FC=$(command -v gfortran)" >> "$GITHUB_ENV"
      - name: Install MPFR/MPC development files
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y libmpfr-dev libmpc-dev libgmp-dev
          else
            brew install mpfr libmpc gmp
            echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"
          fi
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: mpfr-msys
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-mpfr mingw-w64-ucrt-x86_64-mpc mingw-w64-ucrt-x86_64-gmp
      - name: Configure MPFR/MPC search paths
        if: runner.os == 'Windows'
        shell: bash
        run: |
          prefix=$(cygpath -m '${{ steps.mpfr-msys.outputs.msys2-location }}/ucrt64')
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          mkdir -p build/bin
          cp "$prefix/bin/"*.dll build/bin/
      - name: Configure native backends
        shell: bash
        run: |
          generator='Unix Makefiles'
          if [[ "$RUNNER_OS" == 'Windows' ]]; then generator='MinGW Makefiles'; fi
          cmake -S . -B build -G "$generator" -DCMAKE_Fortran_COMPILER="$FC" -DCMAKE_BUILD_TYPE=Release -DSWF_BUILD_TESTS=ON
      - name: Fingerprint native build inputs
        id: native-key
        run: julia --startup-file=no scripts/native_cache_key.jl build
      - uses: actions/cache/restore@v6
        id: native-cache
        if: inputs.clean != true
        with:
          path: |
            build/lib
            build/bin
          key: native-v1-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ steps.native-key.outputs.key }}
      - name: Compile double backend
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then ulimit -v 3145728; fi
          cmake --build build --target spheroidal_batch_double --parallel 1
      - name: Compile quad backend
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then ulimit -v 3145728; fi
          cmake --build build --target spheroidal_batch_quad --parallel 1
      - name: Compile MPFR backend
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then ulimit -v 3145728; fi
          cmake --build build --target spheroidal_batch_mpfr --parallel 1
      - name: Compile native test executables
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then ulimit -v 3145728; fi
          cmake --build build --parallel 1
      - uses: actions/cache/save@v6
        if: inputs.clean != true && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/lib
            build/bin
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-diagnostics-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/bin/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: native-backends-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: |
            build/lib/*.so
            build/lib/*.dylib
            build/bin/*.dll
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: native-tests-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: |
            build/bin/*_test*
            build/CTestTestfile.cmake
            build/test/CTestTestfile.cmake
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-configurations:
    if: inputs.source_run == ''
    name: Shared-source build - ${{ matrix.configuration.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        configuration:
          - {name: double-only, quad: 'OFF', mpfr: 'OFF', type: Release}
          - {name: mpfr-without-quad, quad: 'OFF', mpfr: 'ON', type: Release}
          - {name: debug, quad: 'ON', mpfr: 'ON', type: Debug}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Install MPFR/MPC development files
        if: matrix.configuration.mpfr == 'ON'
        run: sudo apt-get update -qq && sudo apt-get install -y libmpfr-dev libmpc-dev libgmp-dev
      - name: Build the selected backends and native tests
        shell: bash
        env:
          SWF_BUILD_QUAD: ${{ matrix.configuration.quad }}
          SWF_BUILD_MPFR: ${{ matrix.configuration.mpfr }}
          SWF_BUILD_TYPE: ${{ matrix.configuration.type }}
          SWF_BUILD_TESTS: 'ON'
          SWF_RUN_TESTS: 'OFF'
        run: |
          ulimit -v 3145728
          julia --startup-file=no --heap-size-hint=1G scripts/build_from_source.jl
      - uses: actions/upload-artifact@v7
        with:
          name: native-configuration-${{ matrix.configuration.name }}
          path: |
            build/lib/*.so
            build/bin/*_test*
            build/CTestTestfile.cmake
            build/test/CTestTestfile.cmake
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  configuration-tests:
    name: Native ${{ matrix.configuration }}
    needs: build-configurations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: ['double-only', 'mpfr-without-quad', 'debug']
    steps:
      - uses: actions/checkout@v7
      - name: Install arithmetic runtime dependencies
        if: matrix.configuration != 'double-only'
        run: sudo apt-get update -qq && sudo apt-get install -y libmpfr6 libmpc3 libgmp10
      - uses: actions/download-artifact@v8
        with:
          name: native-configuration-${{ matrix.configuration }}
          path: build
      - name: Run native regression group
        run: |
          ulimit -v 3145728
          chmod +x build/bin/*
          ctest --test-dir build --no-tests=error --output-on-failure --parallel 1

  julia-environments:
    if: inputs.source_run == ''
    name: Prepare Julia ${{ matrix.version }} - ${{ matrix.platform.os }} - ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        version: ['1', 'pre', '1.10']
        platform:
          - {os: ubuntu-latest, arch: x64}
          - {os: windows-latest, arch: x64}
          - {os: macos-latest, arch: aarch64}
          - {os: macos-26-intel, arch: x64}
    env:
      EXPECTED_JULIA_ARCH: ${{ matrix.platform.arch }}
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.platform.arch }}
      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-packages-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.version }}
          include-matrix: 'false'
          cache-compiled: 'false'
          delete-old-caches: 'false'
      - name: Resolve the shared environment and fingerprint compilation inputs
        id: julia-key
        shell: bash
        run: |
          # Julia 1.10 checks source mtimes; the compilation key checks source contents.
          git ls-files -z -- src Project.toml | xargs -0 touch -t 200001010000
          julia --startup-file=no --project=. scripts/prepare_ci_environment.jl
      - uses: actions/cache/restore@v6
        id: compiled-cache
        if: inputs.clean != true
        with:
          path: ${{ steps.julia-key.outputs.depot }}/compiled
          key: julia-compiled-v1-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ steps.julia-key.outputs.key }}
      - name: Compile the shared test environment
        if: steps.compiled-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then ulimit -v 3145728; fi
          julia --startup-file=no --heap-size-hint=1G --project=. --check-bounds=yes --inline=yes -O1 scripts/precompile_ci_environment.jl
      - uses: actions/cache/save@v6
        if: inputs.clean != true && steps.compiled-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.julia-key.outputs.depot }}/compiled
          key: ${{ steps.compiled-cache.outputs.cache-primary-key }}
      - name: Package the prepared environment
        shell: bash
        env:
          PREPARED_DEPOT: ${{ steps.julia-key.outputs.depot }}
        run: |
          mkdir -p .scratch/ci-environment
          cp Manifest.toml .scratch/ci-environment/
          if [[ "$RUNNER_OS" == 'Windows' ]]; then PREPARED_DEPOT=$(cygpath -u "$PREPARED_DEPOT"); fi
          mkdir -p "$PREPARED_DEPOT"/{artifacts,packages,registries,compiled,logs,scratchspaces}
          tar -czf .scratch/ci-environment/depot.tar.gz -C "$PREPARED_DEPOT" artifacts packages registries compiled logs scratchspaces
          julia --startup-file=no -e 'print(VERSION, " ", Base.GIT_VERSION_INFO.commit)' > .scratch/ci-environment/julia-version.txt
          if [[ '${{ matrix.platform.os }}' == 'macos-26-intel' ]]; then
            bash scripts/ci_julia_runtime.sh pack .scratch/ci-environment
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: julia-environment-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.version }}
          path: .scratch/ci-environment/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.suite.os }} - ${{ matrix.suite.arch }} - ${{ matrix.suite.name }}
    needs: [native-backends, julia-environments]
    runs-on: ${{ matrix.suite.os }}
    continue-on-error: ${{ matrix.version == 'nightly' }}
    env:
      EXPECTED_JULIA_ARCH: ${{ matrix.suite.arch }}
      SPHEROIDALWAVES_TEST_GROUP: ${{ matrix.suite.groups }}
      SPHEROIDALWAVES_REQUIRE_BACKENDS: 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 48
      matrix:
        version: ['1', 'pre', '1.10']
        suite:
          - {os: ubuntu-latest, arch: x64, name: core, groups: 'api-and-precision,thread-safety,quad-and-domain,accuracy-and-roots,accuracy-diagnostics,numerical-regressions,precision-diagnostics'}
          - {os: ubuntu-latest, arch: x64, name: precision, groups: 'arbitrary-precision,precision-quantities,precision-edge-cases,precision-curvature,precision-complex-curvature'}
          - {os: ubuntu-latest, arch: x64, name: waves, groups: 'precision-wave-references,precision-wave-sensitivities,precision-wave-behavior'}
          - {os: ubuntu-latest, arch: x64, name: parameters-and-functions, groups: 'parameter-derivatives,static-and-second-derivatives,angular-and-coefficients,degree-batches,functions-and-coefficients'}
          - {os: ubuntu-latest, arch: x64, name: coordinates, groups: 'coordinate-sensitivities,coordinates-and-endpoints,precision-eigen-differences,precision-wave-differences'}
          - {os: macos-latest, arch: aarch64, name: core, groups: 'api-and-precision,thread-safety,quad-and-domain,accuracy-and-roots,accuracy-diagnostics,numerical-regressions,precision-diagnostics'}
          - {os: macos-latest, arch: aarch64, name: precision, groups: 'arbitrary-precision,precision-quantities,precision-edge-cases,precision-curvature,precision-complex-curvature'}
          - {os: macos-latest, arch: aarch64, name: waves, groups: 'precision-wave-references,precision-wave-sensitivities,precision-wave-behavior'}
          - {os: macos-latest, arch: aarch64, name: parameters-and-functions, groups: 'parameter-derivatives,static-and-second-derivatives,angular-and-coefficients,degree-batches,functions-and-coefficients'}
          - {os: macos-latest, arch: aarch64, name: coordinates, groups: 'coordinate-sensitivities,coordinates-and-endpoints,precision-eigen-differences,precision-wave-differences'}
          - {os: windows-latest, arch: x64, name: core, groups: 'api-and-precision,thread-safety,quad-and-domain,precision-eigen-differences'}
          - {os: windows-latest, arch: x64, name: accuracy, groups: 'accuracy-and-roots,accuracy-diagnostics,numerical-regressions,precision-diagnostics'}
          - {os: windows-latest, arch: x64, name: precision, groups: 'arbitrary-precision,precision-quantities,precision-edge-cases,precision-complex-curvature', optimize: '0'}
          - {os: windows-latest, arch: x64, name: waves, groups: 'precision-wave-references,precision-wave-behavior,precision-curvature', optimize: '0'}
          - {os: windows-latest, arch: x64, name: sensitivities, groups: 'precision-wave-sensitivities,parameter-derivatives,static-and-second-derivatives'}
          - {os: windows-latest, arch: x64, name: coordinate-sensitivities, groups: 'coordinate-sensitivities'}
          - {os: windows-latest, arch: x64, name: endpoints, groups: 'coordinates-and-endpoints,precision-wave-differences', optimize: '0'}
          - {os: windows-latest, arch: x64, name: functions, groups: 'angular-and-coefficients,degree-batches,functions-and-coefficients'}
          - {os: macos-26-intel, arch: x64, name: api, groups: 'api-and-precision,quad-and-domain'}
          - {os: macos-26-intel, arch: x64, name: wave-differences, groups: 'precision-wave-differences', optimize: '0'}
          - {os: macos-26-intel, arch: x64, name: thread-regressions, groups: 'thread-safety,precision-edge-cases,numerical-regressions,precision-diagnostics'}
          - {os: macos-26-intel, arch: x64, name: accuracy, groups: 'accuracy-diagnostics,coordinates-and-endpoints'}
          - {os: macos-26-intel, arch: x64, name: precision, groups: 'arbitrary-precision,precision-curvature,accuracy-and-roots'}
          - {os: macos-26-intel, arch: x64, name: quantities, groups: 'precision-quantities,degree-batches,precision-eigen-differences'}
          - {os: macos-26-intel, arch: x64, name: waves, groups: 'precision-wave-references,precision-wave-behavior'}
          - {os: macos-26-intel, arch: x64, name: wave-sensitivities, groups: 'precision-wave-sensitivities,precision-complex-curvature'}
          - {os: macos-26-intel, arch: x64, name: parameters, groups: 'parameter-derivatives,static-and-second-derivatives'}
          - {os: macos-26-intel, arch: x64, name: coordinates, groups: 'coordinate-sensitivities'}
          - {os: macos-26-intel, arch: x64, name: functions, groups: 'angular-and-coefficients,functions-and-coefficients'}
        include:
          - {version: '1.10', suite: {os: ubuntu-latest, arch: x64, name: native, groups: 'native-basic,native-prolate,native-oblate,native-context'}}
          - {version: '1.10', suite: {os: macos-latest, arch: aarch64, name: native, groups: 'native-basic,native-prolate,native-oblate,native-context'}}
          - {version: '1.10', suite: {os: windows-latest, arch: x64, name: native-context, groups: 'native-basic,native-context'}}
          - {version: '1.10', suite: {os: windows-latest, arch: x64, name: native-kernels, groups: 'native-prolate,native-oblate'}}
          - {version: '1.10', suite: {os: macos-26-intel, arch: x64, name: native-prolate, groups: 'native-basic,native-prolate'}}
          - {version: '1.10', suite: {os: macos-26-intel, arch: x64, name: native-oblate, groups: 'native-oblate'}}
          - {version: '1.10', suite: {os: macos-26-intel, arch: x64, name: native-context, groups: 'native-context'}}
    steps:
      - uses: actions/checkout@v7
      # Windows needs the build job's matching Fortran/OpenMP runtime search path.
      - uses: fortran-lang/setup-fortran@v1
        if: runner.os == 'Windows'
        with:
          compiler: gcc
          version: '15'
      - uses: julia-actions/setup-julia@v2
        if: startsWith(matrix.suite.groups, 'native-') == false && matrix.suite.os != 'macos-26-intel'
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.suite.arch }}
      - name: Download the prepared Julia environment
        if: startsWith(matrix.suite.groups, 'native-') == false
        uses: actions/download-artifact@v8
        with:
          name: julia-environment-${{ matrix.suite.os }}-${{ matrix.suite.arch }}-${{ matrix.version }}
          path: .scratch/ci-environment
      - name: Restore the prepared Julia runtime
        if: startsWith(matrix.suite.groups, 'native-') == false && matrix.suite.os == 'macos-26-intel'
        shell: bash
        run: bash scripts/ci_julia_runtime.sh restore .scratch/ci-environment
      - name: Restore the prepared Julia environment
        if: startsWith(matrix.suite.groups, 'native-') == false
        shell: bash
        run: |
          git ls-files -z -- src Project.toml | xargs -0 touch -t 200001010000
          cp .scratch/ci-environment/Manifest.toml Manifest.toml
          depot=$(julia --startup-file=no -e 'print(first(DEPOT_PATH))')
          if [[ "$RUNNER_OS" == 'Windows' ]]; then depot=$(cygpath -u "$depot"); fi
          mkdir -p "$depot"
          tar -xzf .scratch/ci-environment/depot.tar.gz -C "$depot"
          julia --startup-file=no -e '@assert read(".scratch/ci-environment/julia-version.txt", String) == string(VERSION, " ", Base.GIT_VERSION_INFO.commit)'
          if [[ '${{ matrix.version }}' == '1.10' && "$SPHEROIDALWAVES_TEST_GROUP" != *api-and-precision* ]]; then
            printf '[SpheroidalWaves]\nprecompile_workload = false\n' > LocalPreferences.toml
          fi
      - name: Download this platform's source-built backends
        uses: actions/download-artifact@v8
        with:
          name: native-backends-${{ matrix.suite.os }}-${{ matrix.suite.arch }}
          path: build
      - name: Download this platform's native tests
        if: startsWith(matrix.suite.groups, 'native-')
        uses: actions/download-artifact@v8
        with:
          name: native-tests-${{ matrix.suite.os }}-${{ matrix.suite.arch }}
          path: build
      - name: Point tests at the freshly built backends
        shell: bash
        run: |
          library_prefix=build/lib/libspheroidal_batch_
          library_extension=so
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            library_prefix=build/bin/spheroidal_batch_
            library_extension=dll
          elif [[ "$RUNNER_OS" == 'macOS' ]]; then
            library_extension=dylib
          fi
          echo "SPHEROIDALWAVES_LIBRARY_DOUBLE=${GITHUB_WORKSPACE}/${library_prefix}double.${library_extension}" >> "$GITHUB_ENV"
          echo "SPHEROIDALWAVES_LIBRARY_QUAD=${GITHUB_WORKSPACE}/${library_prefix}quad.${library_extension}" >> "$GITHUB_ENV"
          echo "SPHEROIDALWAVES_LIBRARY_MPFR=${GITHUB_WORKSPACE}/${library_prefix}mpfr.${library_extension}" >> "$GITHUB_ENV"
      - name: Install MPFR/MPC runtime dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y libmpfr6 libmpc3 libgmp10
          else
            prefix=$(brew --prefix)
            missing=()
            for formula in gcc@15 mpfr libmpc gmp; do
              [[ -d "$prefix/opt/$formula" ]] || missing+=("$formula")
            done
            if (( ${#missing[@]} )); then brew install "${missing[@]}"; fi
          fi
      - name: Configure MPFR/MPC runtime paths
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$GITHUB_WORKSPACE/build/bin" >> "$GITHUB_PATH"
      - uses: julia-actions/julia-runtest@v1
        if: startsWith(matrix.suite.groups, 'native-') == false
        env:
          JULIA_PKG_PRECOMPILE_AUTO: ${{ contains(matrix.suite.groups, 'api-and-precision') && '1' || '0' }}
        with:
          coverage: false # Collected by Coverage.yml.
          allow_reresolve: false
          # Use lower optimization only for groups measured in the focused timing workflow.
          optimize: >-
            ${{ matrix.suite.optimize ||
                (matrix.suite.os == 'macos-26-intel' && matrix.version == 'pre' &&
                 (matrix.suite.name == 'thread-regressions' || matrix.suite.name == 'quantities') && '0') ||
                (matrix.suite.os == 'macos-26-intel' && matrix.suite.name == 'coordinates' && matrix.version != '1.10' && '0') || '1' }}
          # Keep cached stdlibs on Julia 1.10, which lacks the existing-images mode.
          compiled_modules: ${{ (contains(matrix.suite.groups, 'api-and-precision') || matrix.version == '1.10') && 'yes' || 'existing' }}
      - name: Run native regression tests
        if: startsWith(matrix.suite.groups, 'native-')
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then ulimit -v 3145728; fi
          if [[ "$RUNNER_OS" != 'Windows' ]]; then chmod +x build/bin/*; fi
          ctest --test-dir build -L "${SPHEROIDALWAVES_TEST_GROUP//,/|}" --no-tests=error --output-on-failure --parallel 1
      - name: Capture the Windows test crash
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: |
          printf 'set pagination off\nhandle SIGILL nostop noprint pass\nrun\nthread apply all bt 20\ninfo sharedlibrary\n' > build/windows-test.gdb
          if [[ "$SPHEROIDALWAVES_TEST_GROUP" == native-* ]]; then
            gdb --batch --nx -x build/windows-test.gdb --args build/bin/spheroidal_shared_precision_mpfr_test.exe
          else
            gdb --batch --nx -x build/windows-test.gdb --args "$(command -v julia)" --startup-file=no --project=. --check-bounds=yes -O1 test/runtests.jl
          fi

  jll-backends:
    if: inputs.source_run == ''
    name: SpheroidalWaves_jll backends - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-26-intel
            arch: x64
          - os: macos-latest
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
          arch: ${{ matrix.arch }}
      # No build action or compiler installation: exercise what users download.
      - name: Install and check SpheroidalWaves_jll backend libraries
        shell: bash
        run: |
          julia --startup-file=no --project=. -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.resolve()
            Pkg.instantiate()
            using SpheroidalWaves_jll, SpheroidalWaves
            @assert !isdir("build") "Consumer checks must not use a local build"
            @assert isempty(SpheroidalWaves._backend_handles)
            for precision in (:double, :quad)
                path = SpheroidalWaves.backend_library(; precision)
                @assert path !== nothing
                expected = precision === :double ?
                    SpheroidalWaves_jll.libspheroidal_batch_double_path :
                    SpheroidalWaves_jll.libspheroidal_batch_quad_path
                @assert realpath(path) == realpath(expected)
                endpoint = smn(2,3,0.65,1; precision)
                @assert only(endpoint.value) == 0
                @assert isapprox(only(endpoint.derivative), -29.533616783570416; rtol=1e-13)
                if Sys.isapple()
                    for line in split(read(`otool -L $path`, String), "\n")[2:end]
                        isempty(strip(line)) && continue
                        dependency = first(split(strip(line), " ("))
                        @assert any(prefix -> startswith(dependency,prefix), ("@rpath/", "@loader_path/", "/usr/lib/", "/System/Library/")) dependency
                    end
                end
                for spheroid in (:prolate, :oblate)
                    @assert only(smn(1,1,0.3,0; spheroid,precision).value) < 0
                    @assert only(radial_wronskian(0,1,1.0,2; spheroid,precision,form=:error)) < 1e-12
                end
            end
          '
