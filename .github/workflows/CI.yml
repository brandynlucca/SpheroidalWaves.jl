name: CI
env:
  JULIA_NUM_THREADS: 4
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.12'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake build-essential
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Resolve and instantiate dependencies
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.resolve()
          Pkg.instantiate(;allow_build=false)
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        timeout-minutes: 5

  installed-backends:
    name: Installed backends - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: x64
          - os: macos-latest
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
          arch: ${{ matrix.arch }}
      # No build action or compiler installation: exercise what users download.
      - name: Install and check released backend libraries
        shell: bash
        run: |
          julia --startup-file=no --project=. -e '
            using Pkg
            Pkg.resolve()
            Pkg.instantiate(;allow_build=false)
            using Artifacts, SpheroidalWaves
            @assert !isdir("build") "Consumer checks must not use a local build"
            for precision in (:double, :quad)
                path = SpheroidalWaves.backend_library(; precision)
                @assert path !== nothing
                root = artifact_path(artifact_hash("spheroidal_backend_$precision", "Artifacts.toml"))
                @assert dirname(realpath(path)) == realpath(root)
                if Sys.isapple()
                    for line in split(read(`otool -L $path`, String), "\n")[2:end]
                        isempty(strip(line)) && continue
                        dependency = first(split(strip(line), " ("))
                        @assert any(prefix -> startswith(dependency,prefix), ("@rpath/", "@loader_path/", "/usr/lib/", "/System/Library/")) dependency
                    end
                end
                for spheroid in (:prolate, :oblate)
                    @assert only(smn(1,1,0.3,0; spheroid,precision).value) < 0
                    @assert only(radial_wronskian(0,1,1.0,2; spheroid,precision,form=:error)) < 1e-12
                end
            end
          '
