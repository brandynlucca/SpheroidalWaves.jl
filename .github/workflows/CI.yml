name: CI
env:
  JULIA_NUM_THREADS: 2
  JULIA_NUM_PRECOMPILE_TASKS: 1
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
    tags: ['*']
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  native-backends:
    name: Build and check native backends - ${{ matrix.platform.os }} - ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform:
          - os: ubuntu-latest
            arch: x64
            library-pattern: build/lib/libspheroidal_batch_*.so
          - os: windows-latest
            arch: x64
            library-pattern: build/bin/*.dll
          - os: macos-26-intel
            arch: x64
            library-pattern: build/lib/libspheroidal_batch_*.dylib
          - os: macos-latest
            arch: aarch64
            library-pattern: build/lib/libspheroidal_batch_*.dylib
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
          arch: ${{ matrix.platform.arch }}
      - uses: fortran-lang/setup-fortran@v1
        if: runner.os != 'Linux'
        with:
          compiler: gcc
          version: '15'
      - name: Use the runner's Fortran compiler
        if: runner.os == 'Linux'
        shell: bash
        run: echo "FC=$(command -v gfortran)" >> "$GITHUB_ENV"
      - name: Install MPFR/MPC development files
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y libmpfr-dev libmpc-dev libgmp-dev
          else
            brew install mpfr libmpc gmp
            echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"
          fi
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: mpfr-msys
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-mpfr mingw-w64-ucrt-x86_64-mpc mingw-w64-ucrt-x86_64-gmp
      - name: Configure MPFR/MPC search paths
        if: runner.os == 'Windows'
        shell: bash
        run: |
          prefix=$(cygpath -m '${{ steps.mpfr-msys.outputs.msys2-location }}/ucrt64')
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          mkdir -p build/bin
          cp "$prefix/bin/"*.dll build/bin/
      # Share this checkout's libraries with the Julia version and test-group jobs.
      - name: Build and test the shared-source backends
        shell: bash
        env:
          SWF_BUILD_TESTS: 'ON'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then ulimit -v 3145728; fi
          julia --startup-file=no --heap-size-hint=1G scripts/build_from_source.jl
      - name: Capture the Windows native crash
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: |
          where.exe libgfortran-5.dll
          printf 'run\nbt\ninfo sharedlibrary\n' > build/windows-debug.gdb
          gdb --batch --nx -x build/windows-debug.gdb --args build/bin/spheroidal_shared_precision_mpfr_test.exe > build/windows-backtrace.log 2>&1
          cat build/windows-backtrace.log
      - name: Upload native build and test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-diagnostics-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: |
            build/CMakeCache.txt
            build/bin/
            build/build_output.txt
            build/windows-backtrace.log
            build/Testing/Temporary/LastTest.log
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: native-backends-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: ${{ matrix.platform.library-pattern }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-configurations:
    name: Shared-source build - ${{ matrix.configuration.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        configuration:
          - {name: double-only, quad: 'OFF', mpfr: 'OFF', type: Release}
          - {name: mpfr-without-quad, quad: 'OFF', mpfr: 'ON', type: Release}
          - {name: debug, quad: 'ON', mpfr: 'ON', type: Debug}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Install MPFR/MPC development files
        if: matrix.configuration.mpfr == 'ON'
        run: sudo apt-get update -qq && sudo apt-get install -y libmpfr-dev libmpc-dev libgmp-dev
      - name: Build and test the selected backends
        shell: bash
        env:
          SWF_BUILD_QUAD: ${{ matrix.configuration.quad }}
          SWF_BUILD_MPFR: ${{ matrix.configuration.mpfr }}
          SWF_BUILD_TYPE: ${{ matrix.configuration.type }}
          SWF_BUILD_TESTS: 'ON'
        run: |
          ulimit -v 3145728
          julia --startup-file=no --heap-size-hint=1G scripts/build_from_source.jl

  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.platform.os }} - ${{ matrix.platform.arch }} - ${{ matrix.group }}
    needs: native-backends
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.version == 'nightly' }}
    env:
      EXPECTED_JULIA_ARCH: ${{ matrix.platform.arch }}
      SPHEROIDALWAVES_TEST_GROUP: ${{ matrix.group }}
      SPHEROIDALWAVES_REQUIRE_BACKENDS: 'true'
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 48
      matrix:
        group: ['api-and-precision', 'parameter-derivatives', 'coordinates-and-endpoints', 'functions-and-coefficients']
        version:
          - '1'
          - 'pre'
          - '1.10'
          # - 'nightly'
        platform:
          - os: ubuntu-latest
            arch: x64
            library-prefix: build/lib/libspheroidal_batch_
            library-extension: so
          - os: windows-latest
            arch: x64
            library-prefix: build/bin/spheroidal_batch_
            library-extension: dll
          - os: macos-26-intel
            arch: x64
            library-prefix: build/lib/libspheroidal_batch_
            library-extension: dylib
          - os: macos-latest
            arch: aarch64
            library-prefix: build/lib/libspheroidal_batch_
            library-extension: dylib
    steps:
      - uses: actions/checkout@v7
      # Match the build job's Fortran/OpenMP runtime libraries and search path.
      - uses: fortran-lang/setup-fortran@v1
        if: runner.os != 'Linux'
        with:
          compiler: gcc
          version: '15'
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.platform.arch }}
      - uses: julia-actions/cache@v2
      - name: Resolve and instantiate dependencies
        shell: julia --color=yes --project=. {0}
        env:
          # Pkg.test precompiles with its own bounds-checking and optimization flags.
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          @assert Sys.ARCH === (ENV["EXPECTED_JULIA_ARCH"] == "x64" ? :x86_64 : :aarch64)
          using Pkg
          # Test normal startup once per Julia/platform combination. Other groups
          # compile the methods they exercise without repeating the startup workload.
          if ENV["SPHEROIDALWAVES_TEST_GROUP"] != "api-and-precision"
              write("LocalPreferences.toml", "[SpheroidalWaves]\nprecompile_workload = false\n")
          end
          Pkg.Registry.add("General")
          Pkg.resolve()
          Pkg.instantiate()
      - name: Download this platform's source-built backends
        uses: actions/download-artifact@v8
        with:
          name: native-backends-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: build/${{ runner.os == 'Windows' && 'bin' || 'lib' }}
      - name: Point tests at the freshly built backends
        shell: bash
        env:
          LIBRARY_PREFIX: ${{ matrix.platform.library-prefix }}
          LIBRARY_EXTENSION: ${{ matrix.platform.library-extension }}
        run: |
          echo "SPHEROIDALWAVES_LIBRARY_DOUBLE=${GITHUB_WORKSPACE}/${LIBRARY_PREFIX}double.${LIBRARY_EXTENSION}" >> "$GITHUB_ENV"
          echo "SPHEROIDALWAVES_LIBRARY_QUAD=${GITHUB_WORKSPACE}/${LIBRARY_PREFIX}quad.${LIBRARY_EXTENSION}" >> "$GITHUB_ENV"
          echo "SPHEROIDALWAVES_LIBRARY_MPFR=${GITHUB_WORKSPACE}/${LIBRARY_PREFIX}mpfr.${LIBRARY_EXTENSION}" >> "$GITHUB_ENV"
      - name: Install MPFR/MPC runtime dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y libmpfr6 libmpc3 libgmp10
          else
            brew install mpfr libmpc gmp
          fi
      - name: Configure MPFR/MPC runtime paths
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$GITHUB_WORKSPACE/build/bin" >> "$GITHUB_PATH"
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false # Collected by Coverage.yml.
          optimize: 1

  jll-backends:
    name: SpheroidalWaves_jll backends - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-26-intel
            arch: x64
          - os: macos-latest
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
          arch: ${{ matrix.arch }}
      # No build action or compiler installation: exercise what users download.
      - name: Install and check SpheroidalWaves_jll backend libraries
        shell: bash
        run: |
          julia --startup-file=no --project=. -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.resolve()
            Pkg.instantiate()
            using SpheroidalWaves_jll, SpheroidalWaves
            @assert !isdir("build") "Consumer checks must not use a local build"
            @assert isempty(SpheroidalWaves._backend_handles)
            for precision in (:double, :quad)
                path = SpheroidalWaves.backend_library(; precision)
                @assert path !== nothing
                expected = precision === :double ?
                    SpheroidalWaves_jll.libspheroidal_batch_double_path :
                    SpheroidalWaves_jll.libspheroidal_batch_quad_path
                @assert realpath(path) == realpath(expected)
                endpoint = smn(2,3,0.65,1; precision)
                @assert only(endpoint.value) == 0
                @assert isapprox(only(endpoint.derivative), -29.533616783570416; rtol=1e-13)
                if Sys.isapple()
                    for line in split(read(`otool -L $path`, String), "\n")[2:end]
                        isempty(strip(line)) && continue
                        dependency = first(split(strip(line), " ("))
                        @assert any(prefix -> startswith(dependency,prefix), ("@rpath/", "@loader_path/", "/usr/lib/", "/System/Library/")) dependency
                    end
                end
                for spheroid in (:prolate, :oblate)
                    @assert only(smn(1,1,0.3,0; spheroid,precision).value) < 0
                    @assert only(radial_wronskian(0,1,1.0,2; spheroid,precision,form=:error)) < 1e-12
                end
            end
          '
