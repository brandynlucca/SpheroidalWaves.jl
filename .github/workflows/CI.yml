name: CI
env:
  JULIA_NUM_THREADS: 4

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
    tags: ['*']
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.12'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake build-essential
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Resolve and instantiate dependencies
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.Registry.add("General")
          Pkg.resolve()
          Pkg.instantiate()
      # Compile the Fortran sources on every push so source regressions are
      # caught immediately, rather than only when Yggdrasil.yml is run by hand.
      - name: Build backends from source
        run: julia --project=. scripts/build_from_source.jl
      - name: Point tests at the freshly built backends
        shell: bash
        run: |
          echo "SPHEROIDALWAVES_LIBRARY_DOUBLE=$(pwd)/build/lib/libspheroidal_batch_double.so" >> "$GITHUB_ENV"
          echo "SPHEROIDALWAVES_LIBRARY_QUAD=$(pwd)/build/lib/libspheroidal_batch_quad.so" >> "$GITHUB_ENV"
      - uses: julia-actions/julia-runtest@v1
        timeout-minutes: 5

  jll-backends:
    name: SpheroidalWaves_jll backends - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: x64
          - os: macos-latest
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
          arch: ${{ matrix.arch }}
      # No build action or compiler installation: exercise what users download.
      - name: Install and check SpheroidalWaves_jll backend libraries
        shell: bash
        run: |
          julia --startup-file=no --project=. -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.resolve()
            Pkg.instantiate()
            using SpheroidalWaves_jll, SpheroidalWaves
            @assert !isdir("build") "Consumer checks must not use a local build"
            for precision in (:double, :quad)
                path = SpheroidalWaves.backend_library(; precision)
                @assert path !== nothing
                expected = precision === :double ?
                    SpheroidalWaves_jll.libspheroidal_batch_double_path :
                    SpheroidalWaves_jll.libspheroidal_batch_quad_path
                @assert realpath(path) == realpath(expected)
                if Sys.isapple()
                    for line in split(read(`otool -L $path`, String), "\n")[2:end]
                        isempty(strip(line)) && continue
                        dependency = first(split(strip(line), " ("))
                        @assert any(prefix -> startswith(dependency,prefix), ("@rpath/", "@loader_path/", "/usr/lib/", "/System/Library/")) dependency
                    end
                end
                for spheroid in (:prolate, :oblate)
                    @assert only(smn(1,1,0.3,0; spheroid,precision).value) < 0
                    @assert only(radial_wronskian(0,1,1.0,2; spheroid,precision,form=:error)) < 1e-12
                end
            end
          '
