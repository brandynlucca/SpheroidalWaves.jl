name: Validate and update Yggdrasil

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Open a Yggdrasil pull request after validation
        type: boolean
        default: true
      fork:
        description: Your Yggdrasil fork (owner/Yggdrasil)
        type: string
        default: brandynlucca/Yggdrasil
      targets:
        description: Comma-separated targets for focused build timings (blank validates all targets)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  BINARYBUILDER_AUTOMATIC_APPLE: 'true'
  BUILDER_DEPOT: ${{ github.workspace }}/.scratch/binarybuilder-depot
  JULIA_CPU_TARGET: generic
  JULIA_NUM_THREADS: '1'
  JULIA_NUM_PRECOMPILE_TASKS: '1'

concurrency:
  group: yggdrasil-${{ github.ref }}-${{ inputs.targets || 'all' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare BinaryBuilder and select targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JULIA_DEPOT_PATH: '${{ github.workspace }}/.scratch/binarybuilder-depot:'
    outputs:
      version: ${{ steps.recipe.outputs.version }}
      platforms: ${{ steps.targets.outputs.platforms }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          # BinaryBuilder's RISC-V audit needs Julia's newer architecture table.
          version: '1.12'
      - uses: actions/cache@v6
        with:
          path: .scratch/binarybuilder-depot
          key: binarybuilder-tools-v1-${{ runner.os }}-${{ hashFiles('.github/workflows/Yggdrasil.yml') }}
          restore-keys: binarybuilder-tools-v1-${{ runner.os }}-
      - name: Select the shared-source commit and version
        id: recipe
        shell: julia --color=yes {0}
        run: |
          using Pkg, TOML
          project = TOML.parsefile("Project.toml")
          version = VersionNumber(project["version"])
          @assert version in Pkg.Types.semver_spec(project["compat"]["SpheroidalWaves_jll"]) "Package compatibility must include generated JLL $version"
          revision = ENV["GITHUB_SHA"]
          @assert occursin(r"^[0-9a-f]{40}$", revision)
          for geometry in ("prolate", "oblate", "complex_prolate", "complex_oblate")
              @assert isfile("deps/$(geometry)_kernel.F90")
          end
          path = "contrib/yggdrasil/build_tarballs.jl"
          recipe = read(path, String)
          @assert length(collect(eachmatch(r"(?m)^version = v\"[^\"]+\"$", recipe))) == 1
          @assert length(collect(eachmatch(r"\"[0-9a-f]{40}\"", recipe))) == 1
          recipe = replace(recipe, r"(?m)^version = v\"[^\"]+\"$" => "version = v\"$version\"")
          recipe = replace(recipe, r"\"[0-9a-f]{40}\"" => "\"$revision\"")
          write(path, recipe)
          open(ENV["GITHUB_OUTPUT"], "a") do io
              println(io, "version=$version")
          end
      - name: Install BinaryBuilder and check target support
        id: targets
        shell: julia --color=yes --project=@binarybuilder {0}
        env:
          SELECTED_TARGETS: ${{ inputs.targets }}
        run: |
          using Pkg
          isfile(Base.active_project()) ? Pkg.instantiate() : Pkg.add("BinaryBuilder")
          using BinaryBuilder
          for platform in supported_platforms()
              BinaryBuilder.Auditor.generic_march(platform)
          end
          push!(ARGS, "--meta-json=$(ENV["RUNNER_TEMP"])/recipe.json")
          include(joinpath(ENV["GITHUB_WORKSPACE"], "contrib/yggdrasil/build_tarballs.jl"))
          supported = BinaryBuilder.JSON.parsefile(joinpath(ENV["RUNNER_TEMP"], "recipe.json"))["platforms"]
          selected = isempty(ENV["SELECTED_TARGETS"]) ? supported : strip.(split(ENV["SELECTED_TARGETS"], ','))
          @assert !isempty(selected) && all(in(supported), selected) "Unknown or empty build target"
          @assert length(unique(selected)) == length(selected) "Duplicate build target"
          open(ENV["GITHUB_OUTPUT"], "a") do io
              println(io, "platforms=$(BinaryBuilder.JSON.json(selected))")
              println(io, "targets=$(join(selected, ','))")
          end
      - name: Save the prepared build tools and recipe
        run: |
          mkdir -p .scratch/binarybuilder-tools
          tar -czf .scratch/binarybuilder-tools/depot.tar.gz -C "$BUILDER_DEPOT" .
          cp contrib/yggdrasil/build_tarballs.jl .scratch/binarybuilder-tools/build_tarballs.jl
      - uses: actions/upload-artifact@v7
        with:
          name: binarybuilder-tools
          path: .scratch/binarybuilder-tools/
          compression-level: 0
          retention-days: 1

  target-build:
    name: Build and audit ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JULIA_DEPOT_PATH: '${{ github.workspace }}/.scratch/binarybuilder-depot:'
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: actions/download-artifact@v8
        with:
          name: binarybuilder-tools
          path: .scratch/binarybuilder-tools
      - name: Restore the prepared build tools and recipe
        run: |
          mkdir -p "$BUILDER_DEPOT"
          tar -xzf .scratch/binarybuilder-tools/depot.tar.gz -C "$BUILDER_DEPOT"
          cp .scratch/binarybuilder-tools/build_tarballs.jl contrib/yggdrasil/build_tarballs.jl
      - name: Build and audit all three precision libraries
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          ulimit -v 3145728
          julia --heap-size-hint=1G --project=@binarybuilder contrib/yggdrasil/build_tarballs.jl "$BUILD_TARGET" --verbose
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: yggdrasil-target-${{ matrix.target }}
          path: products/
          if-no-files-found: ignore
          compression-level: 0

  build:
    name: Assemble the audited JLL artifacts
    needs: [prepare, target-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JULIA_DEPOT_PATH: '${{ github.workspace }}/.scratch/binarybuilder-depot:'
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: actions/download-artifact@v8
        with:
          name: binarybuilder-tools
          path: .scratch/binarybuilder-tools
      - name: Restore the prepared build tools and recipe
        run: |
          mkdir -p "$BUILDER_DEPOT"
          tar -xzf .scratch/binarybuilder-tools/depot.tar.gz -C "$BUILDER_DEPOT"
          cp .scratch/binarybuilder-tools/build_tarballs.jl contrib/yggdrasil/build_tarballs.jl
      - uses: actions/download-artifact@v8
        with:
          pattern: yggdrasil-target-*
          merge-multiple: true
          path: products
      - name: Generate the JLL from the audited tarballs
        env:
          BUILD_TARGETS: ${{ needs.prepare.outputs.targets }}
        run: |
          ulimit -v 3145728
          julia --heap-size-hint=1G --project=@binarybuilder contrib/yggdrasil/build_tarballs.jl "$BUILD_TARGETS" --skip-build --deploy=local --verbose
      - name: Collect the generated JLL and recipe
        run: |
          cp -R "$BUILDER_DEPOT/dev/SpheroidalWaves_jll" products/SpheroidalWaves_jll
          cp contrib/yggdrasil/build_tarballs.jl products/build_tarballs.jl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: yggdrasil-build
          path: products/
          if-no-files-found: ignore

  runtime:
    if: inputs.targets == ''
    name: JLL ${{ matrix.suite }} - ${{ matrix.platform.os }} - Julia ${{ matrix.julia }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1']
        suite: ['native', 'wave-references-and-behavior', 'wave-sensitivities']
        platform:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: aarch64
          - os: macos-26-intel
            arch: x64
    uses: ./.github/workflows/JLL.yml
    with:
      source_run: ${{ format('{0}', github.run_id) }}
      os: ${{ matrix.platform.os }}
      arch: ${{ matrix.platform.arch }}
      julia: ${{ matrix.julia }}
      suite: ${{ matrix.suite }}

  submit:
    name: Open Yggdrasil update
    if: github.event_name == 'workflow_dispatch' && inputs.submit && inputs.targets == ''
    needs: [build, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.YGGDRASIL_TOKEN }}
      YGGDRASIL_FORK: ${{ inputs.fork }}
      BACKEND_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: yggdrasil-build
          path: validated
      - name: Update the fork and open a pull request
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo 'Set the YGGDRASIL_TOKEN repository secret to a token with write access to your Yggdrasil fork.' >&2; exit 1; }
          [[ "$YGGDRASIL_FORK" =~ ^[A-Za-z0-9-]+/Yggdrasil$ ]] || { echo 'Expected owner/Yggdrasil.' >&2; exit 1; }
          owner="${YGGDRASIL_FORK%%/*}"
          branch="spheroidalwaves-v${BACKEND_VERSION}-${GITHUB_SHA:0:12}"
          gh auth setup-git
          git clone --filter=blob:none --no-checkout --depth=1 --no-tags "https://github.com/$YGGDRASIL_FORK.git" yggdrasil
          cd yggdrasil
          git remote add upstream https://github.com/JuliaPackaging/Yggdrasil.git
          git fetch upstream master --depth=1 --no-tags
          if gh api "repos/$YGGDRASIL_FORK/git/ref/heads/$branch" >/dev/null 2>&1; then
            git fetch origin "$branch" --depth=1 --no-tags
            git checkout -b "$branch" FETCH_HEAD
          else
            git checkout -b "$branch" upstream/master
          fi
          mkdir -p S/SpheroidalWaves
          cp ../validated/build_tarballs.jl S/SpheroidalWaves/build_tarballs.jl
          git add S/SpheroidalWaves/build_tarballs.jl
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions\[bot\] -c user.email=41898282+github-actions\[bot\]@users.noreply.github.com commit -m "[SpheroidalWaves] Update to v$BACKEND_VERSION"
            git push origin "$branch"
          fi
          existing="$(gh pr list --repo JuliaPackaging/Yggdrasil --head "$owner:$branch" --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            echo "$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Builds SpheroidalWaves backends from %s at commit %s.\n\nBinaryBuilder builds and dependency audits passed for all recipe targets. Native double, quad, and MPFR checks passed on current Ubuntu, Windows, Apple Silicon macOS, and Intel macOS runners with Julia 1.10 and latest stable: %s/actions/runs/%s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/yggdrasil-pr.md"
            gh pr create --repo JuliaPackaging/Yggdrasil --base master --head "$owner:$branch" \
              --title "[SpheroidalWaves] Update to v$BACKEND_VERSION" --body-file "$RUNNER_TEMP/yggdrasil-pr.md" >> "$GITHUB_STEP_SUMMARY"
          fi
